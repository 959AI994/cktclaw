[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cktclaw"
version = "2.0.0-dev"
description = "The Autonomous Multi-Agent Ecosystem for Intelligent EDA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jingxin Wang", email = "jingxin.wang@sjtu.edu.cn"},
]
keywords = ["eda", "chip-design", "circuit", "verilog", "ai", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "pydantic>=2.0",
    # Cloud LLM SDK — required for the claude provider. OpenAI/DeepSeek providers
    # use plain HTTP (requests) and need no extra SDK.
    "anthropic>=0.40",
]

[project.optional-dependencies]
local = ["torch>=2.0", "transformers>=4.30"]
cloud = ["anthropic>=0.20", "openai>=1.0"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "websockets>=11.0"]
memory = ["sentence-transformers>=2.2", "chromadb>=0.4"]
full = [
    "torch>=2.0",
    "transformers>=4.30",
    "anthropic>=0.20",
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]

[project.urls]
Homepage = "https://github.com/959AI994/cktclaw"
Issues = "https://github.com/959AI994/cktclaw/issues"

[project.scripts]
cktclaw = "cktclaw.main:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["cktclaw*"]

[tool.setuptools.package-data]
cktclaw = [
    "skills/rtl_claw_skills/**/*.md",
    "skills/fpga_agent_bundled/**/*.md",
    "skills/verilog_generator_bundled/**",
]
