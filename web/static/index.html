<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CktClaw Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1b26;
            color: #a9b1d6;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            padding: 1.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #414868;
        }
        .header h1 { color: #7aa2f7; font-size: 1.5rem; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-connected { background: #9ece6a33; color: #9ece6a; }
        .status-disconnected { background: #f7768e33; color: #f7768e; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: #24283b;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #414868;
        }
        .card h3 { color: #bb9af7; margin-bottom: 0.5rem; font-size: 0.9rem; }

        .agent-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #2f334d;
        }
        .agent-name { color: #7dcfff; }
        .agent-status { font-size: 0.8rem; }
        .agent-status.running { color: #e0af68; }
        .agent-status.completed { color: #9ece6a; }
        .agent-status.failed { color: #f7768e; }

        .event-log {
            background: #24283b;
            border-radius: 8px;
            padding: 1rem;
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid #414868;
        }
        .event-log h3 { color: #bb9af7; margin-bottom: 0.5rem; }
        .event-item {
            padding: 4px 0;
            border-bottom: 1px solid #2f334d;
            font-size: 0.85rem;
        }
        .event-time { color: #565f89; margin-right: 8px; }
        .event-type { color: #9ece6a; font-weight: bold; margin-right: 8px; }
        .event-data { color: #c0caf5; }

        .metric { text-align: center; }
        .metric .value { font-size: 2rem; color: #7aa2f7; font-weight: bold; }
        .metric .label { font-size: 0.8rem; color: #565f89; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CktClaw Dashboard</h1>
        <span id="connection-status" class="status-badge status-disconnected">Disconnected</span>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Model</h3>
            <div id="model-info" class="metric">
                <div class="value">--</div>
                <div class="label">Current Provider</div>
            </div>
        </div>
        <div class="card">
            <h3>Tools</h3>
            <div id="tools-count" class="metric">
                <div class="value">--</div>
                <div class="label">Registered Tools</div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom: 1rem;">
        <h3>Active Agents</h3>
        <div id="agents-list">
            <div style="color: #565f89; padding: 8px 0;">No active agents</div>
        </div>
    </div>

    <div class="event-log">
        <h3>Event Log</h3>
        <div id="events"></div>
    </div>

    <script>
        let ws;
        const statusEl = document.getElementById('connection-status');
        const eventsEl = document.getElementById('events');
        const agentsEl = document.getElementById('agents-list');
        const modelEl = document.getElementById('model-info');
        const toolsEl = document.getElementById('tools-count');

        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status-badge status-connected';
                fetchStatus();
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status-badge status-disconnected';
                setTimeout(connect, 3000);
            };

            ws.onmessage = (e) => {
                const event = JSON.parse(e.data);
                addEvent(event);

                // Update agent list on agent events
                if (['spawned', 'completed', 'failed', 'killed'].includes(event.type)) {
                    fetchStatus();
                }
            };
        }

        function addEvent(event) {
            const div = document.createElement('div');
            div.className = 'event-item';
            const time = new Date(event.timestamp).toLocaleTimeString();
            const dataStr = JSON.stringify(event.data || {}).slice(0, 150);
            div.innerHTML = `<span class="event-time">${time}</span><span class="event-type">${event.type}</span><span class="event-data">${dataStr}</span>`;
            eventsEl.prepend(div);
            if (eventsEl.children.length > 200) eventsEl.lastChild.remove();
        }

        async function fetchStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                // Update model
                if (data.model) {
                    modelEl.innerHTML = `<div class="value">${data.model}</div><div class="label">Current Provider</div>`;
                }

                // Update tools count
                if (data.tools) {
                    toolsEl.innerHTML = `<div class="value">${data.tools.length}</div><div class="label">Registered Tools</div>`;
                }

                // Update agents
                if (data.agents && data.agents.length > 0) {
                    agentsEl.innerHTML = data.agents.map(a => `
                        <div class="agent-item">
                            <span class="agent-name">${a.name || a.agent_id}</span>
                            <span class="agent-status ${a.status}">${a.status}</span>
                        </div>
                    `).join('');
                } else {
                    agentsEl.innerHTML = '<div style="color: #565f89; padding: 8px 0;">No active agents</div>';
                }
            } catch (e) {}
        }

        connect();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
